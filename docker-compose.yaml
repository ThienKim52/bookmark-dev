version: '3.7'

services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  bookmark_service:
    image: bookmark-service-test:latest
    build: .
    container_name: bookmark-service
    depends_on:
    - redis
    ports:
    - "8080:8080"
    environment:
    - ADDRESS=redis:6379
  
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bookmark
    volumes:
      - ./postgres_data:/var/lib/postgresql/data:Z
